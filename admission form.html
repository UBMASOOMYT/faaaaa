<form>

<table border="1" align="center" cellpadding="10">

<tr>
<th colspan="2">Student Details</th>
</tr>

<tr>
<td>Full Name</td>
<td><input type="text" placeholder="Enter Name"></td>
</tr>

<tr>
<td>Father's Name</td>
<td><input type="text" placeholder="Enter Father's Name"></td>
</tr>

<tr>
<td>Mobile Number</td>
<td><input type="tel" placeholder="Enter Mobile"></td>
</tr>

<tr>
<td>Email</td>
<td><input type="email" placeholder="Enter Email"></td>
</tr>

<tr>
<td>Gender</td>
<td>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
</td>
</tr>

<tr>
<td>Course</td>
<td>
<select>
<option>Select Course</option>
<option>HTML</option>
<option>CSS</option>
<option>JavaScript</option>
<option>Python</option>
</select>
</td>
</tr>

<tr>
<td>City</td>
<td><input type="text" placeholder="Enter City"></td>
</tr>

<tr>
<td>Address</td>
<td>
<textarea rows="3" cols="25" placeholder="Enter Address"></textarea>
</td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="Submit">
<input type="reset" value="Clear">
</td>
</tr>

</table>

</form>
