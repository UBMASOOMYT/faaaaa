<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Asia Travel Booking</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#eaf6ff;
}

.container{
    width:360px;
    margin:80px auto;
    background:#fff;
    border:2px solid #0033cc;
    border-radius:8px;
    padding:18px;
}

h1{
    text-align:center;
    color:#003b7a;
    font-size:20px;
    margin-bottom:15px;
}

hr{
    margin-bottom:15px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:10px;
    margin-bottom:5px;
}

input{
    width:100%;
    padding:8px;
    border:1px solid #bbb;
    border-radius:4px;
}

button{
    margin-top:25px;
    background:#4d8cff;
    color:white;
    border:none;
    padding:8px 20px;
    border-radius:15px;
    cursor:pointer;
}

button:hover{
    background:#1e5fff;
}

.back{
    margin-top:15px;
    text-align:center;
}

.back a{
    text-decoration:none;
    color:#0033cc;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>✈ AIR ASIA TRAVEL BOOKING</h1>

<hr>

<form action="confirem.html">

<label>Traveller Name</label>
<input type="text" placeholder="Enter Your Name">

<label>Date of Travel</label>
<input type="date">

<label>Telephone Number</label>
<input type="tel" placeholder="Enter Mobile Number">

<button type="submit">SUBMIT</button>

</form>

<div class="back">
    <a href="index.html">← Back to SOP List</a>
</div>

</div>

</body>
</html>
